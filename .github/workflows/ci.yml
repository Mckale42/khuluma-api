# GitHub Actions CI for the Khuluma API (PROG7314 Part 2 rubric: automated
# build + unit tests on every push). Runs type-check/build and the Jest suite.
name: API CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check / build
        run: npm run build

      - name: Run unit tests
        run: npm test
